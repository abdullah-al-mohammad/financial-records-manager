<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <style>
    .brand-text { fill: #ffffff; }
  </style>
  <!-- Wing / speed-lines icon (white wordmark variant for dark sidebar) -->
  <!-- Line 1 (top) — full white -->
  <rect x="0" y="10" width="52" height="10" rx="2" class="brand-text" />
  <!-- Line 2 — white body, orange left cap -->
  <rect x="8" y="26" width="44" height="10" rx="2" class="brand-text" />
  <rect x="0" y="26" width="14" height="10" rx="2" fill="#F07028"/>
  <!-- Line 3 — white body, orange left cap -->
  <rect x="12" y="42" width="40" height="10" rx="2" class="brand-text" />
  <rect x="0" y="42" width="18" height="10" rx="2" fill="#F07028"/>
  <!-- Line 4 (bottom) — white body, orange left cap -->
  <rect x="16" y="58" width="36" height="10" rx="2" class="brand-text" />
  <rect x="0" y="58" width="22" height="10" rx="2" fill="#F07028"/>

  <!-- FATAFAT wordmark in white for dark sidebar -->
  <text
    x="80"
    y="60"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="44"
    font-weight="900"
    class="brand-text"
    letter-spacing="2"
  >FATAFAT</text>
</svg>
